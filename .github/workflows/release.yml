name: Release

# Pushing a tag v0.y.z builds one-file binaries for Windows, Linux and macOS and attaches them, with
# SHA256SUMS, to a GitHub Release. The tag must match earthwave/__init__.py and a CHANGELOG.md section.
on:
  push:
    tags: ["v0.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not of the form v0.y.z"; exit 1
          fi
          version="${tag#v}"
          pkg=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' earthwave/__init__.py)
          if [ "$pkg" != "$version" ]; then
            echo "::error::tag $tag does not match earthwave/__init__.py __version__ ($pkg)"; exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            exe: earthwave.exe
          - os: ubuntu-latest
            name: linux-x86_64
            exe: earthwave
          - os: macos-latest
            name: macos-arm64
            exe: earthwave
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m PyInstaller --noconfirm --clean earthwave.spec
      - name: Smoke test the binary
        shell: bash
        run: |
          ./dist/${{ matrix.exe }} --version
          ./dist/${{ matrix.exe }} --selftest
      - name: Name the artifact
        shell: bash
        run: |
          mkdir out
          ext=""
          if [ "${{ matrix.exe }}" = "earthwave.exe" ]; then ext=".exe"; fi
          cp "dist/${{ matrix.exe }}" "out/earthwave-${GITHUB_REF_NAME}-${{ matrix.name }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: earthwave-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and notes
        shell: bash
        run: |
          cd out
          sha256sum earthwave-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          awk -v h="## [${{ needs.verify.outputs.version }}]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
