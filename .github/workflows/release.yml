name: Release

# Pushing a tag v0.y.z builds one-file binaries for Windows, Linux (x86_64, arm64) and macOS (arm64, x86_64), attests
# their provenance and attaches them, with SHA256SUMS, to a GitHub Release. The tag must match earthwave/__init__.py and
# a CHANGELOG.md section. The build, the file-set check and the release come from WPTK/release-workflows. post-release.yml
# then downloads the published assets and runs them.
on:
  push:
    tags: ["v0.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not on main"; exit 1
          fi
          if ! [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not of the form v0.y.z"; exit 1
          fi
          version="${tag#v}"
          pkg=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' earthwave/__init__.py)
          if [ "$pkg" != "$version" ]; then
            echo "::error::tag $tag does not match earthwave/__init__.py __version__ ($pkg)"; exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The release notes are this version's changelog section; the shared publish workflow reads them from this artifact.
      - name: Extract the release notes
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" \
            'index($0, h) == 1 { on = 1; next } on && (/^## / || /^\[[0-9.]+\]: /) { exit } on && $0 != "_First release._"' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/binaries.yml

  # The file set and the tag are checked before anything is attested, so no signed claim is made about a moved tag or a
  # stray file. publish repeats both checks. There is no wheel or sdist in the release (PyPI is publish.yml's job).
  check:
    name: Check the files and the tag
    needs: [verify, build]
    uses: WPTK/release-workflows/.github/workflows/check-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      python-artifact: ""
      expected-files: |
        earthwave-${{ github.ref_name }}-windows-x86_64.exe
        earthwave-${{ github.ref_name }}-linux-x86_64.tar.gz
        earthwave-${{ github.ref_name }}-linux-arm64.tar.gz
        earthwave-${{ github.ref_name }}-macos-arm64.tar.gz
        earthwave-${{ github.ref_name }}-macos-x86_64.tar.gz

  # Provenance is made here, in this workflow, and not in the shared publish workflow: the certificate names the workflow
  # that ran the step, and `gh attestation verify --signer-workflow` (post-release.yml) expects this file. It attests the
  # same artifacts the publish job releases.
  attest:
    name: Attest build provenance
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

  publish:
    name: Create the GitHub release
    needs: [verify, build, attest]
    permissions:
      contents: write
    uses: WPTK/release-workflows/.github/workflows/publish-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      python-artifact: ""
      expected-files: |
        earthwave-${{ github.ref_name }}-windows-x86_64.exe
        earthwave-${{ github.ref_name }}-linux-x86_64.tar.gz
        earthwave-${{ github.ref_name }}-linux-arm64.tar.gz
        earthwave-${{ github.ref_name }}-macos-arm64.tar.gz
        earthwave-${{ github.ref_name }}-macos-x86_64.tar.gz
