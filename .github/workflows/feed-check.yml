name: Feed check

# Fetches each live feed the app depends on once a day and runs it through the app's own parsers
# (scripts/check_feeds.py). Never part of PR CI: it talks to real servers.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: feed-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      raise: ${{ steps.check.outputs.raise }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      # The streak file counts consecutive unavailable runs per feed. Cache entries are immutable, so each run
      # saves under its own key and the next run restores the newest one.
      - uses: actions/cache@v6
        with:
          path: feed-streaks.json
          key: feed-streaks-${{ github.run_id }}
          restore-keys: feed-streaks-
      - id: check
        run: python scripts/check_feeds.py --state feed-streaks.json --report feed-report.md --output "$GITHUB_OUTPUT"
      - run: cat feed-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: feed-report
          path: feed-report.md
          retention-days: 14

  report:
    needs: check
    if: needs.check.outputs.raise != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.check.outputs.raise }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feed-report
      - name: Open an issue, or comment on the open one
        run: |
          if [ "$KIND" = format ]; then
            title="Feed check: a live feed no longer parses"
            lead="A live feed answered in a format the app cannot read. The app's parser needs a look."
          else
            title="Feed check: a live feed has been unavailable for several runs"
            lead="A live feed has been down or empty for several runs in a row. This is not a format change."
          fi
          { printf '%s\n\n' "$lead"; cat feed-report.md; printf '\nRun: %s\n' "$RUN_URL"; } > body.md
          gh label create feed-check --color BFD4F2 --description "Daily live feed check" 2>/dev/null || true
          open=$(gh issue list --label feed-check --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "$title" --label feed-check --body-file body.md
          fi
