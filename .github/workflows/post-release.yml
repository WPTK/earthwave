name: Post-release smoke

# Downloads the PUBLISHED release assets by their public URLs, on the OS each one is built for, verifies them against the
# published SHA256SUMS and runs them. Release.yml tests the binary before upload; this tests what users actually get.
#
# A release made with GITHUB_TOKEN does not fire `release: published` for other workflows, so this follows the Release
# workflow instead. It can also be started by hand for an existing tag (Actions > Post-release smoke > Run workflow).
# --selftest must not print SKIPPED, so tags older than the build that bundles the fixtures (v0.2.0) fail on purpose.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke test, e.g. v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows-x86_64
            ext: exe
          - os: ubuntu-24.04
            name: linux-x86_64
            ext: tar.gz
          - os: macos-15
            name: macos-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # head_branch of a workflow_run started by a tag push is the tag name.
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    defaults:
      run:
        shell: bash
    steps:
      # Before anything is downloaded: checkout cleans the workspace. Windows only, for the real-input suite below.
      - uses: actions/checkout@v4
        if: matrix.ext == 'exe'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        if: matrix.ext == 'exe'
        with:
          python-version: "3.13"
      - name: Download the published assets
        run: |
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }
          mkdir smoke && cd smoke
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          asset="earthwave-${TAG}-${{ matrix.name }}.${{ matrix.ext }}"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 10 -o "$asset" "$base/$asset"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 10 -o SHA256SUMS "$base/SHA256SUMS"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Verify the checksum
        working-directory: smoke
        run: |
          grep -F " $ASSET" SHA256SUMS > mine.sums || { echo "::error::$ASSET is not in SHA256SUMS"; exit 1; }
          if command -v sha256sum >/dev/null; then sha256sum --check mine.sums; else shasum -a 256 --check mine.sums; fi
      - name: Unpack
        working-directory: smoke
        run: |
          if [ "${{ matrix.ext }}" = "exe" ]; then
            cp "$ASSET" earthwave.exe
          else
            tar -xzf "$ASSET"
          fi
      - name: Run --version and --selftest
        working-directory: smoke
        run: |
          exe=./earthwave; [ "${{ matrix.ext }}" = "exe" ] && exe=./earthwave.exe
          version=$($exe --version)
          echo "$version"
          [ "$version" = "earthwave ${TAG#v}" ] || { echo "::error::--version says '$version', expected ${TAG#v}"; exit 1; }
          $exe --selftest | tee selftest.txt
          if grep -q SKIPPED selftest.txt; then echo "::error::--selftest skipped checks in the published binary"; exit 1; fi
          grep -q "selftest: ok" selftest.txt
          $exe --diagnose --offline
      - name: Keep the asset path for the real-input run
        if: matrix.ext == 'exe'
        run: echo "EARTHWAVE_EXE=$PWD/smoke/$ASSET" >> "$GITHUB_ENV"  # the published name, so its SHA256SUMS line matches
      # Windows only: the real-input suite (ConPTY, real keystrokes) against the published exe. The suite checks the exe
      # against the SHA256SUMS next to it. Not yet seen running in CI; it does not block the smoke verdict until it is.
      - name: Real-input suite
        if: matrix.ext == 'exe'
        continue-on-error: true
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/uat/test_realinput.py -q -p no:cacheprovider
