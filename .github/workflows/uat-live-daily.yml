name: UAT live daily

# The real program against the real feeds, once a day on Windows (08:00 UTC) and on Linux (11:00 UTC, ahead of
# feed-check at 12:47), each finishing inside its hour. Screen rules on after every step; --record always on, uploaded.
# Never part of PR CI. The macOS cell is a marked slot: no runner was available for the spikes (see docs/uat.md).
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cron: "0 8 * * *"
          - os: ubuntu-latest
            cron: "0 11 * * *"
          # macos: slot only, not built
    env:
      UAT_REAL: "1"
      UAT_NETWORK: "1"
      UAT_DISPOSABLE: "1"
      UAT_OUT: uat-out
      PYTHONUTF8: "1"
      # a scheduled run does only its own cell; a manual run does both
      RUN_ME: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == matrix.cron }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_ME == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_ME == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - if: env.RUN_ME == 'true'
        run: python -m pip install -e ".[dev]"
      - if: env.RUN_ME == 'true'
        run: python -m pytest tests/uat/test_live.py -p no:xdist -q --tb=short
      - name: One real capture, kept for the corpus (tests/uat/test_corpus.py replays every saved capture)
        if: always() && env.RUN_ME == 'true'
        run: python scripts/uat/capture.py capture/${{ matrix.os }}-capture.jsonl 60
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_ME == 'true'
        with:
          name: uat-capture-${{ matrix.os }}
          path: capture
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_ME == 'true'
        with:
          name: uat-live-${{ matrix.os }}
          path: uat-out
          if-no-files-found: ignore
          retention-days: 14
