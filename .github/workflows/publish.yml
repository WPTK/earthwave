name: Publish to PyPI

# Run by hand from the Actions tab. Builds the sdist and wheel at `ref`, checks them, and uploads to PyPI
# with trusted publishing (OIDC): the `pypi` environment is the only thing that can publish, and no token
# is stored anywhere. Publishing an already-uploaded version fails; nothing here deletes or overwrites a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build and publish (for example v0.2.0)
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: The built wheel version matches the source
        run: |
          python - <<'PY'
          import glob, re, zipfile
          from pathlib import Path
          src = re.search(r'^__version__ = "([^"]+)"', Path("earthwave/__init__.py").read_text("utf-8"), re.MULTILINE).group(1)
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              meta = z.read(name).decode()
          built = next(l.split(": ", 1)[1] for l in meta.splitlines() if l.startswith("Version: "))
          assert built == src, f"wheel version {built} != source version {src}"
          print("wheel version", built)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
