[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "earthwave"
dynamic = ["version"]
description = "Earthquakes and tsunami alerts in your terminal. Live USGS quakes, tsunami warnings and sea-level readings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Bill Kane" }]
keywords = ["earthquake", "tsunami", "usgs", "tui", "terminal", "textual"]

dependencies = [
    "textual>=8.2,<9",
    "httpx>=0.28,<1",
    "hishel[httpx]>=1.1,<2",
    "anysqlite>=0.0.5",  # hishel[httpx] brings it; imported directly for the in-memory cache
    "stamina>=25.1,<27",
    "platformdirs>=4,<5",
]

[project.urls]
Homepage = "https://github.com/WPTK/earthwave"
Issues = "https://github.com/WPTK/earthwave/issues"
Changelog = "https://github.com/WPTK/earthwave/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "psutil>=6",
    "pytest-cov>=5",
    "hypothesis>=6",
    "geographiclib>=2",
    "pytest-textual-snapshot",
    "textual==8.2.8",
    "ruff>=0.8",
    "vulture>=2.14",
    "mypy>=1.13",
    "pyinstaller>=6.22,<7",
    "build>=1,<2",
    "twine>=5",
    "pyshp",
    "tui-test==0.1.1",
    "obspy>=1.4",  # oracle for earthwave/iasp91_table.py: tests/test_seismo_oracle.py, scripts/gen_iasp91_table.py
]

[project.scripts]
earthwave = "earthwave.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "earthwave.__version__" }

[tool.setuptools.packages.find]
include = ["earthwave*"]

[tool.setuptools.package-data]
earthwave = ["ui/*.tcss", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Slowest test is about 10 s; 120 s leaves room for a loaded CI runner and still stops a hang.
timeout = 120
testpaths = ["tests"]
markers = [
    "chaos: slow soak and random-input probes under tests/chaos (deselect with -m \"not chaos\")",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # Textual widgets declare BINDINGS/DEFAULT_CSS as plain class attributes by convention.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are inline fixture payloads; wrapping them hurts readability.
"tests/**" = ["E501"]
# UAT tooling and spike scripts: long probe tables and one-off probes.
"scripts/uat/**" = ["E501", "C408", "RUF059", "RUF100"]
# Vendored unchanged from eyewall spike S4 (and the driver built on it): not reformatted.
"scripts/uat/macos/**" = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["earthwave"]
warn_unused_configs = true
warn_redundant_casts = true
# Baseline, not a target: these modules had 26 errors when mypy joined CI (0.3.0). Everything else is checked.
# Fix a module's errors, then delete it from this list; do not add to it.
[[tool.mypy.overrides]]
module = [
    "earthwave.app",
    "earthwave.config",
    "earthwave.sources.usgs",
    "earthwave.state.store",
    "earthwave.ui.graphics.probe",
    "earthwave.ui.graphics.smooth",
    "earthwave.ui.screens.tsunami",
    "earthwave.ui.theme",
    "earthwave.ui.widgets.map_panel",
    "earthwave.ui.widgets.quake_list",
]
ignore_errors = true
